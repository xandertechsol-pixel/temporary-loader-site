<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Amazing Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <!-- Animated background elements -->
            <div class="floating-orbs">
                <div class="orb orb-1"></div>
                <div class="orb orb-2"></div>
                <div class="orb orb-3"></div>
            </div>

            <!-- Main content -->
            <div class="text-wrapper">
                <div class="logo-container">
                    <img class="logo" src="https://res.cloudinary.com/dvt237a8g/image/upload/v1779701669/rccghog_t8hbvj.png" alt="Church logo">
                </div>
                <h1 class="main-text">We are working on bringing you an amazing experience</h1>
                <p class="subtitle">website live soon</p>
            </div>

            <!-- Loading animation -->
            <div class="loader">
                <div class="loader-bar"></div>
            </div>

            <!-- Animated particles -->
            <div class="particles">
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
                <div class="particle"></div>
            </div>
        </div>
    </div>
</body>
</html>
